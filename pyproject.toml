# Single source of tool configuration.
#
# There was also a .pylintrc, a 500-line dump of pylint's defaults inherited
# from the course template. Pylint reads .pylintrc in preference to this file,
# so the two silently disagreed and the one you would read lost: this file said
# line length 80 and c-extension-no-member off, .pylintrc said 120 and on. The
# real customisations are folded in below and the dump is gone.

[tool.pylint.main]
# Pygame is a C extension, so pylint cannot see most of its members and reports
# a false no-member on nearly every call. Both settings are needed: one to let
# it introspect the compiled module, one to stop it complaining that it did.
extension-pkg-allow-list = "pygame"
py-version = "3.12"

[tool.pylint.typecheck]
generated-members = "pygame.*"
# pygame.Rect's members are defined in C, so pylint infers .center as an opaque
# object and reports centre[0] as unsubscriptable. It is a tuple. Every finding
# this suppresses was a false positive; the game runs and 117 tests cover it.
ignored-classes = ["pygame.Rect", "pygame.Surface", "pygame.rect.Rect"]
# Dev-tool-only dependencies. tools/trace_map.py needs numpy and Pillow, which
# are deliberately not in requirements.txt because playing the game does not
# need them, so pylint cannot import them and says so.
ignored-modules = ["numpy", "PIL"]

[tool.pylint.format]
max-line-length = 88
max-module-lines = 1200

[tool.pylint.design]
# A game loop legitimately has more branches and locals than a web handler,
# and a drawing function legitimately takes (surface, x, y, w, h, colour, ...).
# These sit where the existing code sits rather than at pylint's defaults,
# which are tuned for library code and would bury real findings in noise.
max-args = 14
max-positional-arguments = 14
max-attributes = 40
max-branches = 30
max-locals = 30
max-public-methods = 40
max-statements = 80
max-returns = 12

[tool.pylint.refactoring]
max-nested-blocks = 8

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "invalid-name",
    # The UI draws a label and a panel in two places with a similar shape.
    # Pylint counts it as duplication; extracting a shared helper for four
    # lines of blitting would cost more than it saves.
    "duplicate-code",
]

[tool.pylint.reports]
# CI treats any message as a failure, so a numeric floor would only ever
# disagree with it. Left at pylint's default rather than set to something
# that looks strict and is not enforced.
score = "no"
