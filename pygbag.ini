[DEPENDENCIES]
# Everything listed here is left out of the browser bundle.
#
# The leading slash matters. pygbag matches an ignored directory with
# `folder.as_posix().startswith(block + "/")`, and the folders it walks are
# rooted paths like "/docs/screenshots". Without the slash only the top-level
# directory is skipped and every subdirectory is still packed -- which silently
# left 33 MB of screenshots and dev tooling in the bundle.
#
# /docs        the original project's static Quarto site: bootstrap, fonts,
#              and full-resolution screenshots. Worth keeping in the repo,
#              dead weight in a build.
# /tools       development scripts, plus asset_originals/ backups
# /tests       test suite
# /soundtrack  excluded deliberately, see the note below
#
# /build, /.git, /venv and friends are already in pygbag's own default list.
#
# The soundtrack is left out for three separate reasons: the current file is
# an MP3 and browsers need OGG, its filename contains spaces which pygbag
# rejects outright, and it is a Spotify rip that should not be redistributed.
# Drop a licensed .ogg into soundtrack/ and delete that entry below to ship
# music on the web.
ignoreDirs = ["/docs", "/tools", "/tests", "/soundtrack"]

# map_background.png is a leftover from the original project that nothing
# loads. equidistant_points.csv IS used -- it is the Monkey Meadow track.
ignoreFiles = ["map_background.png"]
