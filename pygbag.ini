[DEPENDENCIES]
# Everything listed here is left out of the browser bundle.
#
# The leading slash matters. pygbag matches an ignored directory with
# `folder.as_posix().startswith(block + "/")`, and the folders it walks are
# rooted paths like "/tools/asset_originals". Without the slash only the
# top-level directory is skipped and every subdirectory is still packed, which
# silently left tens of megabytes of dev tooling in the bundle.
#
# /tools       development scripts, plus asset_originals/ backups
# /tests       test suite
# /soundtrack  excluded deliberately, see the note below
#
# /build, /.git, /venv and friends are already in pygbag's own default list.
#
# The soundtrack is left out for two reasons that are both about the format
# rather than the licence: the file is an MP3 and browsers here need OGG, and
# its filename contains spaces, which pygbag rejects outright. Convert it to a
# space-free .ogg and drop "/soundtrack" from the list below to ship music on
# the web.
ignoreDirs = ["/tools", "/tests", "/soundtrack"]

# equidistant_points.csv IS used, it is the Monkey Meadow track, so nothing is
# excluded by name any more. map_background.png used to be listed here as a
# leftover that nothing loaded; it has since been deleted from the repository.
ignoreFiles = []
